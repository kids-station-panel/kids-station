  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow-x: hidden; max-width: 100vw; }
    body { font-family: 'Nunito', 'Segoe UI', sans-serif; background: #f0f4ff; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #1e5cb3; border-radius: 3px; }
    #root { overflow-x: hidden; max-width: 100vw; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.35s ease forwards; }
    .pop-in { animation: popIn 0.3s ease forwards; }

    .nav-btn:hover { opacity: 0.85; transform: scale(1.04); }
    .nav-btn { transition: all 0.15s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(30,58,110,0.18) !important; }
    .card-hover { transition: all 0.2s; }
    input:focus, select:focus { border-color: #1e5cb3 !important; box-shadow: 0 0 0 3px rgba(30,92,179,0.15); }
    input, select { transition: all 0.2s; }
    button:active { transform: scale(0.97); }

    /* ── RESPONSIVE ───────────────────────────────────────── */

    /* ── NAV SCROLL ─────────────────────────────────────── */
    .nav-scroll {
      display: flex;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
      gap: 0;
    }
    .nav-scroll::-webkit-scrollbar { display: none; }
    /* Mobil: sabit genişlik, yatay scroll */
    .nav-scroll .nav-btn {
      flex: 0 0 auto;
      min-width: 58px;
    }
    /* Tablet+ (≥601px): tüm container genişliğini eşit doldur */
    @media (min-width: 601px) {
      .nav-scroll .nav-btn {
        flex: 1 1 0;
        min-width: 0;
      }
    }

    /* ── GRID ────────────────────────────────────────────── */
    .grid-2col {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
    }
    .grid-3col {
      display: grid !important;
      grid-template-columns: repeat(3, 1fr) !important;
    }

    /* ── STAT CARDS ──────────────────────────────────────── */
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    /* ── PAGE TITLE ──────────────────────────────────────── */
    .ks-page-title { font-size: 26px; font-weight: 900; }

    /* ── CALENDAR SCROLL ─────────────────────────────────── */
    .cal-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ── TABLE SCROLL ────────────────────────────────────── */
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ── CARD ────────────────────────────────────────────── */
    .ks-card { overflow-x: hidden; }

    /* ── MAIN CONTENT ────────────────────────────────────── */
    .ks-main-content { -webkit-overflow-scrolling: touch; }

    /* ── iPhone SAFE AREA ────────────────────────────────── */
    .ks-header-top, .ks-safe-header {
      padding-top: max(env(safe-area-inset-top, 0px), 0px);
    }
    body {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    /* Avatar aspect-ratio fix */
    .ks-avatar-btn {
      aspect-ratio: 1 / 1;
      border-radius: 50% !important;
      overflow: hidden !important;
      flex-shrink: 0 !important;
    }

    /* ── TABLET (≤ 768px) ────────────────────────────────── */
    @media (max-width: 768px) {
      .ks-header-top { padding: 10px 12px 0 !important; }
      .ks-header-row { margin-bottom: 8px !important; }
      .ks-panel-label { display: none !important; }
      .ks-btn-label { display: none !important; }
      .ks-header-btn { padding: 8px 10px !important; min-height: 36px !important; }
      .ks-main-content { padding: 14px 10px 24px !important; }
      .ks-card { padding: 16px 14px !important; }
      button { min-height: 40px; }
      .nav-scroll .nav-btn { min-height: 52px; font-size: 10px !important; }
      .nav-scroll .nav-btn > span:first-child { font-size: 16px !important; }
    }

    /* ── MOBİL (≤ 600px) ────────────────────────────────── */
    @media (max-width: 600px) {
      /* Header */
      .ks-header-top { padding: 8px 10px 0 !important; }
      .ks-header-row { margin-bottom: 6px !important; }
      .ks-user-name { font-size: 11px !important; max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ks-user-role { font-size: 10px !important; }
      .ks-header-actions { gap: 6px !important; }
      .ks-header-btn { padding: 6px 8px !important; font-size: 16px !important; min-height: 34px !important; }

      /* Nav */
      .nav-scroll .nav-btn { min-width: 56px; font-size: 10px !important; padding: 7px 4px 9px !important; }
      .nav-scroll .nav-btn > span:first-child { font-size: 16px !important; }

      /* Grid: mobilde 1 kolon */
      .grid-2col { grid-template-columns: 1fr !important; }
      .grid-3col { grid-template-columns: repeat(2, 1fr) !important; }

      /* Stat cards: 2x2 */
      .stat-cards { grid-template-columns: repeat(2, 1fr); gap: 8px; }

      /* Content */
      .ks-main-content { padding: 12px 8px 20px !important; }
      .ks-page-title { font-size: 20px !important; }

      /* Login */
      .ks-login-card { padding: 28px 20px !important; }

      /* Modal */
      .ks-modal-inner { padding: 22px 16px !important; max-height: 88vh !important; }
    }

    /* ── KÜÇÜK MOBİL (≤ 390px) ──────────────────────────── */
    @media (max-width: 390px) {
      .ks-header-btn { padding: 5px 7px !important; }
      .ks-header-actions { gap: 4px !important; }
      .nav-scroll .nav-btn { min-width: 50px; }
      .stat-cards { gap: 6px; }
    }
